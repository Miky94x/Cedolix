<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#111416" />
    <title>Cedolix</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cedolix" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <script>
      ["gesturestart", "gesturechange", "gestureend"].forEach(function (e) {
        document.addEventListener(e, function (x) {
          x.preventDefault();
        });
      });
      var V = "1.8.2";
      document.write('<link rel="stylesheet" href="style.css?v=' + V + '">');
    </script>
  </head>
  <body>
    <div id="app"></div>
    <nav>
      <button data-t="h" aria-label="Home">
        <span class="ic"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11l9-8 9 8" />
            <path d="M5 10v10h5v-6h4v6h5V10" /></svg></span
        >Home
      </button>
      <button data-t="m" aria-label="Mese">
        <span class="ic"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="17" rx="3" />
            <path d="M8 2v4M16 2v4M3 10h18" /></svg></span
        >Mese
      </button>
      <button data-t="f" aria-label="Ferie">
        <span class="ic"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
            /></svg></span
        >Ferie
      </button>
      <button data-t="p" aria-label="Busta">
        <span class="ic"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"
            />
            <path d="M14 3v5h5M9 13h6M9 17h6" /></svg></span
        >Busta
      </button>
      <button data-t="s" aria-label="Altro">
        <span class="ic"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 6h8M16 6h4M4 12h2M10 12h10M4 18h10M18 18h2" />
            <circle cx="14" cy="6" r="2" />
            <circle cx="8" cy="12" r="2" />
            <circle cx="16" cy="18" r="2" /></svg></span
        >Altro
      </button>
    </nav>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    </script>
    <script>
      document.write('<script src="app.js?v=' + V + '"><\/script>');
      if ("serviceWorker" in navigator && /^https?:/.test(location.protocol))
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
    </script>
  </body>
</html>
